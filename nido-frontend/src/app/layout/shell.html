<mat-sidenav-container class="contenedor">
  <mat-sidenav [mode]="esMovil() ? 'over' : 'side'" [opened]="esMovil() ? menuAbierto() : true"
               (closedStart)="menuAbierto.set(false)" class="menu">
    <div class="marca">
      <img src="logo-isotipo-claro.svg" alt="" width="36" height="36" />
      <span>Nido</span>
    </div>
    <nav>
      @for (opcion of menu(); track opcion.ruta) {
        <a [routerLink]="opcion.ruta" routerLinkActive="activo" class="enlace" (click)="alNavegar()">
          <mat-icon>{{ opcion.icono }}</mat-icon>
          <span>{{ opcion.nombre }}</span>
        </a>
      }
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="barra">
      @if (esMovil()) {
        <button mat-icon-button (click)="alternarMenu()" aria-label="Abrir menú"><mat-icon>menu</mat-icon></button>
      }
      <span class="espacio"></span>
      <button type="button" [matMenuTriggerFor]="menuUsuario" class="usuario">
        <span class="avatar">{{ iniciales() }}</span>
        <span class="datos">
          <strong>{{ auth.sesion()?.nombres }}</strong>
          <small>{{ rol() }}</small>
        </span>
        <mat-icon>arrow_drop_down</mat-icon>
      </button>
      <mat-menu #menuUsuario="matMenu">
        <button mat-menu-item (click)="auth.logout()"><mat-icon>logout</mat-icon><span>Cerrar sesión</span></button>
      </mat-menu>
    </mat-toolbar>
    <main class="contenido"><router-outlet /></main>
  </mat-sidenav-content>
</mat-sidenav-container>
